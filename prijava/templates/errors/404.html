{% extends "layout.html" %}
{% block title %}Stranica nije pronađena · {{ school_name }}{% endblock %}

{% block content %}
<section class="error-screen">
    <div class="error-num">404</div>
    <h1 class="error-title">Stranica nije pronađena</h1>
    <p class="error-lede">Nažalost, stranica koju tražite ne postoji ili je premeštena.</p>
    <a class="btn btn-primary" href="{{ url_for('public.application') }}">
        <span class="btn-label">Povratak na formu</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
    </a>
</section>
{% endblock %}
