{% extends "layout.html" %}
{% block title %}Neispravan zahtev · {{ school_name }}{% endblock %}

{% block content %}
<section class="error-screen">
    <div class="error-num">400</div>
    <h1 class="error-title">Neispravan zahtev</h1>
    <p class="error-lede">Podaci koje je pretraživač poslao nisu ispravni. Pokušajte ponovo.</p>
    <a class="btn btn-primary" href="{{ url_for('public.application') }}">
        <span class="btn-label">Povratak na formu</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
    </a>
</section>
{% endblock %}
