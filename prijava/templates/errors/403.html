{% extends "layout.html" %}
{% block title %}Pristup odbijen · {{ school_name }}{% endblock %}

{% block content %}
<section class="error-screen">
    <div class="error-num">403</div>
    <h1 class="error-title">Nemate pristup ovoj stranici</h1>
    <p class="error-lede">Za pristup ovom sadržaju potrebno je da budete prijavljeni kao administrator.</p>
    <a class="btn btn-primary" href="{{ url_for('public.application') }}">
        <span class="btn-label">Povratak na formu</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
    </a>
</section>
{% endblock %}
