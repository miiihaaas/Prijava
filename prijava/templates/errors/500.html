{% extends "layout.html" %}
{% block title %}Greška na serveru · {{ school_name }}{% endblock %}

{% block content %}
<section class="error-screen">
    <div class="error-num">500</div>
    <h1 class="error-title">Nešto nije uredu</h1>
    <p class="error-lede">Došlo je do greške na strani servera. Pokušajte ponovo za nekoliko trenutaka. Ako se problem nastavi, kontaktirajte školu.</p>
    <a class="btn btn-primary" href="{{ url_for('public.application') }}">
        <span class="btn-label">Povratak na formu</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
    </a>
</section>
{% endblock %}
