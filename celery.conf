# Naziv i putanja do Celery aplikacije
CELERYD_APP="prijava.celery_app.celery"

# Broj radnih procesa za Celery
CELERYD_WORKERS=2

# Lokacija log fajlova
CELERYD_LOG_FILE="/path/to/your/celery/logs/%n%I.log"
CELERYD_PID_FILE="/path/to/your/celery/pids/%n.pid"

# Log level
CELERYD_LOG_LEVEL="info"

# Maksimalan broj taskova po detetu pre recikliranja procesa
CELERYD_MAX_TASKS_PER_CHILD=100
